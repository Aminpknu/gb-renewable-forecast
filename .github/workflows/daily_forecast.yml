name: Daily GB day-ahead forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: daily-day-ahead-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Generate forecast
        run: python -m src.forecast_tomorrow

      - name: Persist public dashboard outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f outputs/forecasts/latest_forecast.csv
          git add -f outputs/forecasts/latest_forecast_summary.json

          if git diff --cached --quiet; then
            echo "No public forecast changes to persist."
          else
            git commit -m "Update daily forecast outputs"
            git push
          fi
